# Netlify config for the comments backend of 0xaakibalam.com/blogs.
#
# `pnpm run build` also runs `prisma migrate deploy`, so DB_URL must be set in
# Netlify's environment variables (not here) and must be Neon's DIRECT connection
# string, not the "-pooler" one: Prisma migrations break through a pooler.
# Prisma's Lambda engine comes from `binaryTargets` in prisma/schema.prisma.

[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Ship Prisma's Lambda engine with every function. .npmrc's node-linker=hoisted
# keeps it at this flat path instead of deep inside node_modules/.pnpm.
[functions]
  included_files = [
    "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node",
    "node_modules/.prisma/client/schema.prisma",
  ]

# Next.js Runtime v5 (needs Next 13.5+). v4, installed from Netlify's UI at first,
# never shipped Prisma's engine.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Must come after the Next.js runtime: it patches the function that runtime builds.
[[plugins]]
  package = "./netlify/plugins/copy-prisma-engine"
